# Compila el sinte Recuerdo (VST3 / AU) para macOS y Windows y lo valida con pluginval.
# Los binarios quedan como "artifacts" descargables en la pestaña Actions de GitHub.
name: Recuerdo synth (VST3)

on:
  push:
    paths:
      - "synth/Recuerdo/**"
      - ".github/workflows/recuerdo-synth.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-2022
            name: Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: synth/Recuerdo
    steps:
      - uses: actions/checkout@v5

      - name: Configurar (macOS, universal arm64 + Intel)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Configurar (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/Recuerdo_artefacts/Release
          codesign --force --deep -s - "$A/VST3/Recuerdo.vst3"
          codesign --force --deep -s - "$A/AU/Recuerdo.component"
          mkdir -p dist
          ditto -c -k --keepParent "$A/VST3/Recuerdo.vst3" dist/Recuerdo-macOS-VST3.zip
          ditto -c -k --keepParent "$A/AU/Recuerdo.component" dist/Recuerdo-macOS-AU.zip

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Recuerdo_artefacts/Release/VST3/Recuerdo.vst3 -DestinationPath dist/Recuerdo-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Recuerdo-${{ matrix.name }}
          path: synth/Recuerdo/dist/*.zip

      - name: Validar con pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests \
            --validate build/Recuerdo_artefacts/Release/VST3/Recuerdo.vst3

      - name: Validar con pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          ./pv/pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests --validate build/Recuerdo_artefacts/Release/VST3/Recuerdo.vst3
          if ($LASTEXITCODE -ne 0) { exit 1 }
